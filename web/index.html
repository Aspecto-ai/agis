<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGIS – AspectoGIS</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.12.1/proj4.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ol@10.2.1/dist/ol.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>

  // Fyll inn for produksjon. Tom = demo-modus (data kun i minnet).
  window.ASPECTO_KART_CONFIG = {
    supabaseUrl: "https://mbflcnxevsowkguhclml.supabase.co",
    supabaseAnonKey: "sb_publishable_zKuNb79RDhR_WqnVugRagA_gd_P5qZ2",
    staffDomain: "aspecto.no",
    appName: "AGIS"
  };
</script>
<style>
/* Layout: toppstripe + venstre panel + kart. Palett hentet fra Aspecto-profilen (marineblå) med sjøgrønn aksent. */
:root{
  --navy:#224754; --navy-deep:#16313b; --sea:#1f8a8a; --sea-soft:#dff1f0;
  --bg:#f6f8f8; --panel:#ffffff; --fg:#1b2a30; --muted:#5e7279; --line:#d9e1e3;
  --ok:#2e8b57; --warn:#d99a1f; --bad:#c84b3a; --info:#3b7fc4;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:6px; --shadow:0 2px 10px rgba(22,49,59,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1b20; --panel:#15262c; --fg:#e6eef0; --muted:#9db2b9; --line:#2b3f46; --sea-soft:#163a3a; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#0f1b20; --panel:#15262c; --fg:#e6eef0; --muted:#9db2b9; --line:#2b3f46; --sea-soft:#163a3a; color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sea)}
[hidden]{display:none!important}

.app{display:grid;grid-template-rows:52px 1fr;grid-template-columns:340px 1fr;height:100%}
.app.embed{grid-template-rows:0 1fr;grid-template-columns:0 1fr}
.app.embed .topbar,.app.embed .panel{display:none}

/* Toppstripe */
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 max(14px,env(safe-area-inset-left,0px)) 0 max(14px,env(safe-area-inset-left,0px));background:var(--navy);color:#fff;border-bottom:1px solid var(--navy-deep)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;white-space:nowrap}
.brandlogo{height:30px;width:auto;display:block}
.brandtag{font-weight:600;letter-spacing:.16em;font-size:12px;padding:2px 7px;border:1px solid rgba(255,255,255,.45);border-radius:4px;opacity:.95}
.topbar .title{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.topbar .title input{background:transparent;border:1px solid transparent;color:#fff;font-weight:500;font-size:15px;padding:4px 8px;border-radius:4px;width:100%;max-width:520px}
.topbar .title input:focus{outline:none;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.06)}
.topbar .title input:read-only{pointer-events:none}
.userchip{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.95;white-space:nowrap}
.userchip .dot{width:8px;height:8px;border-radius:50%;background:#7bd389}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:6px 10px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--sea)}
.btn.primary{background:var(--sea);border-color:var(--sea);color:#fff}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.btn.small{padding:3px 7px;font-size:12px}
.btn.danger{color:var(--bad)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sea);outline-offset:1px}

/* Panel */
.panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.panel header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel h2{margin:0;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.panel .scroll{overflow:auto;flex:1;min-height:0;padding:10px 14px 16px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:10px 6px;font-size:13px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.active{color:var(--fg);border-bottom-color:var(--sea)}

.mapcard{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}
.mapcard:hover{border-color:var(--sea)}
.mapcard b{display:block;font-weight:600}
.mapcard small{color:var(--muted);display:block;margin-top:2px}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--sea-soft);color:var(--sea);font-weight:500;margin-left:6px}

.layer{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.layer .sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.25)}
.layer .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.layer .meta{font-size:11px;color:var(--muted);font-family:var(--mono)}
.layer .acts{display:flex;gap:2px}
.iconbtn{border:0;background:transparent;width:26px;height:26px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn:hover{background:var(--bg);color:var(--fg)}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.layer input[type=checkbox]{width:16px;height:16px;accent-color:var(--sea)}
.legend{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--muted);padding:2px 0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}

.section{margin-top:14px}
.section h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:7px 8px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}
.hint{font-size:12px;color:var(--muted)}
code,.mono{font-family:var(--mono);font-size:12px}
pre.embed{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;overflow-x:auto;font-size:11px;white-space:pre-wrap;word-break:break-all}
.comment{border-left:3px solid var(--info);padding:6px 10px;margin-bottom:8px;background:var(--bg);border-radius:0 4px 4px 0}
.comment.resolved{border-left-color:var(--ok);opacity:.7}
.comment .who{font-size:11px;color:var(--muted);font-family:var(--mono)}
.access{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.custgroup{margin-bottom:14px}
.pill.lock,.lockbadge{background:#f6e3df;color:#9c3326}
.lockbadge{font-size:10px;font-weight:600;letter-spacing:.1em;padding:2px 7px;border-radius:3px;white-space:nowrap}
.notice.lock{background:#f6e3df;color:#7a271d}
.lgroup{display:flex;align-items:center;gap:8px;padding:8px 0 4px;margin-top:6px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.lgroup input{width:16px;height:16px;accent-color:var(--sea)} .lgroup .cnt{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400}
.lgroup .chev{transition:transform .15s} .lgroup.closed .chev{transform:rotate(-90deg)}
.layer.ingroup{padding-left:10px}
.custname{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 6px}
.custname span{text-transform:none;letter-spacing:0;font-weight:400}
.welcome{text-align:center;padding:18px 6px 10px}
.welcome img{width:70%;max-width:220px;height:auto}
.welcome h3{margin:14px 0 4px;font-size:15px;letter-spacing:.04em}
.welcome p{margin:0 0 10px;color:var(--muted);font-size:12px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .welcome img{filter:brightness(0) invert(1)} }
:root[data-theme="dark"] .welcome img{filter:brightness(0) invert(1)}
.notice{background:var(--sea-soft);color:var(--navy);border-radius:4px;padding:8px 10px;font-size:12px;margin-bottom:10px}
:root[data-theme="dark"] .notice, .dark .notice{color:#cfe9e8}

/* Kartområde */
.mapwrap{position:relative;min-width:0;min-height:0}
#map{position:absolute;inset:0}
.toolbar{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:6px;z-index:5}
.toolbar .grp{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.toolbar .grp button{width:36px;height:34px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.toolbar .grp button + button{border-top:1px solid var(--line)}
.toolbar .grp button:hover{background:var(--bg)}
.toolbar .grp button.active{background:var(--sea);color:#fff}
.toolbar svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.statusbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:6px 10px;pointer-events:none;z-index:4;font-family:var(--mono);font-size:11px;color:var(--fg)}
.statusbar > *{background:rgba(255,255,255,.82);padding:2px 6px;border-radius:3px;pointer-events:auto}
:root[data-theme="dark"] .statusbar > *{background:rgba(21,38,44,.85)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .statusbar > *{background:rgba(21,38,44,.85)} }
.modehint{position:absolute;top:10px;left:56px;z-index:5;background:var(--navy);color:#fff;padding:6px 10px;border-radius:var(--radius);font-size:12px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.modehint button{background:#fff;color:var(--navy);border:0;border-radius:4px;padding:3px 8px;font-size:12px;font-weight:600}
.embedbadge{position:absolute;left:10px;bottom:34px;z-index:5;background:var(--navy);color:#fff;border-radius:var(--radius);padding:6px 10px;font-size:12px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow)}
.embedbadge a{color:#fff;font-weight:600}
.panel-toggle{display:none;position:absolute;right:10px;bottom:34px;z-index:6}

/* Dialog */
.dialog{position:fixed;inset:0;background:rgba(22,49,59,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dialog .box{background:var(--panel);color:var(--fg);border-radius:8px;padding:18px;width:min(420px,100%);box-shadow:var(--shadow)}
.dialog h3{margin:0 0 12px;font-size:15px}
.dialog p.hint{white-space:pre-wrap;max-height:240px;overflow:auto}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--fg)}
.chk input{margin-top:2px;width:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;z-index:60;box-shadow:var(--shadow)}


/* Dra og slipp */
.dropzone{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:2px dashed var(--line);border-radius:8px;padding:22px 14px;cursor:pointer;background:var(--bg);transition:border-color .15s,background .15s}
.dropzone:hover,.dropzone.over{border-color:var(--sea);background:var(--sea-soft)}
.dropzone svg,.dropoverlay svg{width:30px;height:30px;stroke:var(--sea);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dropzone b{font-size:14px}.dropzone span{color:var(--muted);font-size:12px}.dropzone small{color:var(--muted);font-size:11px;margin-top:6px;line-height:1.4}
.optgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.optgrid .btn{justify-content:center}
.dropoverlay{position:absolute;inset:8px;z-index:30;border:3px dashed var(--sea);border-radius:10px;background:rgba(31,138,138,.14);display:flex;align-items:center;justify-content:center;pointer-events:none}
.dropoverlay > div{background:var(--panel);border-radius:8px;box-shadow:var(--shadow);padding:16px 20px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.dropoverlay span{color:var(--muted);font-size:12px}
.droptip{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.rlegend{align-items:center}.rlegend .bar{display:inline-block;width:110px;height:8px;border-radius:2px;margin:0 6px}
.toast.busy{bottom:64px}

/* OpenLayers – nødvendig CSS (inlinet) */
.ol-viewport{position:relative;overflow:hidden;width:100%;height:100%;touch-action:none}
.ol-viewport canvas{display:block}
.ol-layer{position:absolute;width:100%;height:100%}
.ol-unselectable{-webkit-touch-callout:none;user-select:none;-webkit-tap-highlight-color:transparent}
.ol-viewport, .ol-unselectable{-webkit-user-select:none}
.ol-selectable{user-select:text}
.ol-grabbing{cursor:grabbing}.ol-grab{cursor:grab}
.mapwrap.mode-draw .ol-viewport{cursor:crosshair}
.ol-control{position:absolute}
.ol-scale-line{position:absolute;left:10px;bottom:30px;background:rgba(255,255,255,.82);padding:2px 6px;border-radius:3px}
.ol-scale-line-inner{border:1px solid var(--fg);border-top:none;color:var(--fg);font-family:var(--mono);font-size:10px;text-align:center;margin:1px;will-change:contents,width;transition:all .25s}
.ol-overlay-container{will-change:left,right,top,bottom}
.ol-attribution{display:none}
.popup{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:var(--panel);color:var(--fg);border-radius:6px;box-shadow:var(--shadow);padding:12px 14px;min-width:230px;max-width:330px;width:max-content}
.popup::after{content:"";position:absolute;top:100%;left:50%;margin-left:-9px;border:9px solid transparent;border-top-color:var(--panel)}
.popup h4{margin:0 20px 6px 0;font-size:14px}
.popup table{border-collapse:collapse;width:100%;font-size:12px}
.popup td{padding:2px 6px 2px 0;vertical-align:top;border-bottom:1px solid var(--line)}
.popup td:first-child{color:var(--muted);white-space:nowrap}
.popup textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:4px;padding:6px;background:var(--bg)}
.popup .close{position:absolute;right:4px;top:2px;background:none;border:0;font-size:18px;color:var(--muted)}
.crsbadge{font-weight:500}
.crsbadge b{font-weight:600}
.statusbar select{font:inherit;font-size:11px;border:0;background:transparent;color:var(--fg);padding:0}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .panel{position:absolute;left:0;right:0;bottom:0;top:52px;z-index:20;transform:translateY(100%);transition:transform .2s}
  .panel.open{transform:none}
  .panel-toggle{display:inline-flex}
  .brandtag{display:none}
  .topbar .title input{font-size:14px;min-width:120px;padding-left:0}
  .userchip > span{display:none}
  .toolbar{top:auto;bottom:72px}
  .toolbar .grp{flex-direction:row}
  .toolbar .grp button + button{border-top:0;border-left:1px solid var(--line)}
  .modehint{left:10px;right:10px;top:52px}
}
@media (prefers-reduced-motion:reduce){ .panel{transition:none} }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <a class="brand" href="?" id="brandLink" title="Alle kart">
      <img src="logo-white.png" alt="Aspecto" class="brandlogo">
      <span class="brandtag">AGIS</span>
    </a>
    <div class="title"><input id="mapTitle" placeholder="Velg et kart" readonly><span class="lockbadge" id="lockBadge" hidden title="Begrenset kart – bare navngitte personer har tilgang">BEGRENSET</span></div>
    <div class="userchip" id="userchip"></div>
  </div>

  <aside class="panel" id="panel">
    <div class="tabs" id="tabs" hidden>
      <button data-tab="layers" class="active">Lag</button>
      <button data-tab="comments">Kommentarer</button>
      <button data-tab="share">Deling</button>
    </div>
    <header id="panelHeader"><h2 id="panelTitle">Kart</h2><div id="panelActions"></div></header>
    <div class="scroll" id="panelBody"></div>
  </aside>

  <div class="mapwrap">
    <div id="map"></div>
    <div class="toolbar" id="toolbar">
      <div class="grp">
        <button id="zoomIn" title="Zoom inn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button id="zoomOut" title="Zoom ut"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <button id="zoomFit" title="Zoom til data"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
      <div class="grp" id="drawTools">
        <button data-mode="point" title="Tegn punkt"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" stroke-dasharray="2 3"/></svg></button>
        <button data-mode="line" title="Tegn linje"><svg viewBox="0 0 24 24"><path d="M4 18L10 8l5 7 5-11"/><circle cx="4" cy="18" r="1.5"/><circle cx="20" cy="4" r="1.5"/></svg></button>
        <button data-mode="polygon" title="Tegn polygon"><svg viewBox="0 0 24 24"><path d="M5 8l8-4 6 6-3 9-10-2z"/></svg></button>
        <button data-mode="measure" title="Mål avstand"><svg viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M8 12l2 2M11 9l2 2M14 6l2 2"/></svg></button>
        <button data-mode="comment" title="Legg til kommentar"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
      </div>
    </div>
    <div class="modehint" id="modehint" hidden></div>
    <div class="statusbar"><span id="coords">—</span><span class="crsbadge" id="crsbadge">—</span></div>
    <div id="popup" class="popup" hidden></div>
    <div class="dropoverlay" id="dropOverlay" hidden><div><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg><b>Slipp filene for å legge dem til som lag</b><span>Filer eller hele mapper · GeoTIFF · GeoPackage · Shapefil · GeoJSON · KML · GPX · CSV/Excel</span></div></div>
    <div class="embedbadge" id="embedbadge" hidden></div>
    <button class="btn primary panel-toggle" id="panelToggle">Lag og info</button>
  </div>
</div>
<div id="dialogHost"></div>

<script>
(function(){
'use strict';
const CFG = window.ASPECTO_KART_CONFIG || {};
const qs = new URLSearchParams(location.search);
const EMBED = qs.get('embed') === '1';
const DEMO = qs.get('demo') === '1' || !CFG.supabaseUrl;
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now());
const fmtDate = d => new Date(d).toLocaleDateString('nb-NO', {day:'2-digit', month:'short', year:'numeric'});

// ---- Katalog med faglag (WMS) ---------------------------------------------
// Grunnlaget er alltid Kartverket topo (se TOPO_WMS). Disse kan legges oppå med ett klikk.
const CATALOG = [
  {name:'Sjøkart raster (Kartverket)', kind:'wms', source:{url:'https://wms.geonorge.no/skwms1/wms.sjokartraster', layers:'sjokartraster', version:'1.3.0'}},
  {name:'Dybdedata – kurver (Kartverket)', kind:'wms', source:{url:'https://wms.geonorge.no/skwms1/wms.dybdedata2', layers:'Dybdekurver', version:'1.3.0'}},
  {name:'Dybdedata – skyggerelieff (Kartverket)', kind:'wms', source:{url:'https://wms.geonorge.no/skwms1/wms.dybdedata2', layers:'Dybdelag', version:'1.3.0'}},
  {name:'Akvakultur – lokaliteter (Fiskeridirektoratet)', kind:'wms', source:{url:'https://gis.fiskeridir.no/server/services/fiskeridirWMS_akva/MapServer/WMSServer', layers:'akvakultur_lokaliteter', version:'1.3.0'}},

// ---- Geometri-hjelpere ---------------------------------------------------
function bboxOf(fc, b){
  const walk = (c)=>{ if(typeof c[0]==='number'){ b = b? [Math.min(b[0],c[0]),Math.min(b[1],c[1]),Math.max(b[2],c[0]),Math.max(b[3],c[1])] : [c[0],c[1],c[0],c[1]]; } else c.forEach(walk); };
  (fc.features||[]).forEach(f=>{ if(f.geometry&&f.geometry.coordinates) walk(f.geometry.coordinates); });
  return b;
}
function haversine(a,b){ const R=6371000, toR=x=>x*Math.PI/180; const dLat=toR(b[1]-a[1]), dLng=toR(b[0]-a[0]); const h=Math.sin(dLat/2)**2+Math.cos(toR(a[1]))*Math.cos(toR(b[1]))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function fmtDist(m){ return m>=1000 ? (m/1000).toFixed(2)+' km' : Math.round(m)+' m'; }
function fmtArea(a){ return a>=1e6 ? (a/1e6).toFixed(3)+' km²' : a>=1e4 ? (a/1e4).toFixed(2)+' daa' : Math.round(a)+' m²'; }

//   Finnmark   (68°N og nordover, 22°Ø og østover) EPSG:25835  EUREF89 UTM 35N

// Sørger for at en EPSG-kode er kjent (UTM-soner registreres automatisk). Returnerer true hvis kjent.
function ensureProjection(code){
  if(!code) return false; code = 'EPSG:' + String(code).replace(/^.*?(\d{4,5})$/, '$1');
  if(ol.proj.get(code)) return code;
  const n = +code.split(':')[1]; let def=null;
  if(n>=25828 && n<=25838) def=`+proj=utm +zone=${n-25800} +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs`;
  else if(n>=32601 && n<=32660) def=`+proj=utm +zone=${n-32600} +datum=WGS84 +units=m +no_defs`;
  else if(n>=23028 && n<=23038) def=`+proj=utm +zone=${n-23000} +ellps=intl +towgs84=-87,-98,-121,0,0,0,0 +units=m +no_defs`;
  if(!def) return false;
  proj4.defs(code, def); ol.proj.proj4.register(proj4); return code;
}
function crsFor(lon, lat){
  if(lon>=-8.5 && lon<=-5.5 && lat>=61.2 && lat<=62.6) return 'EPSG:5316';           // Færøyane
  if(lon>=-9.5 && lon<=2.0 && lat>=49.5 && lat<=61.2) return 'EPSG:27700';            // Skottland/Storbritannia
  if(lat>=68.0 && lon>=FINNMARK_LON) return 'EPSG:25835';                             // Finnmark
  return lat < CRS_SPLIT_LAT ? 'EPSG:25832' : 'EPSG:25833';                           // Sør- / Nord-Norge
}

const GeoJSONFmt = new ol.format.GeoJSON();

let map, view, VIEW_CRS = 'EPSG:25833';
let topoLayer, draftSource, draftLayer, commentSource, commentLayer, popupOverlay, drawInteraction=null;
const hoverBound = new Set();

// WMS hentes i kartets CRS når tjenesten støtter det (norske UTM-soner), ellers i EPSG:3857 og reprojiseres.
function wmsLayer(url, layers, opts={}){
  const supported = opts.projections || NOR_CRS;
  const proj = supported.includes(VIEW_CRS) ? VIEW_CRS : 'EPSG:3857';
  return new TileLayer({ opacity: opts.opacity ?? 1, zIndex: opts.zIndex ?? 0, source: new TileWMS({
    url, params:{ LAYERS: layers, VERSION: opts.version||'1.3.0', FORMAT: opts.format||'image/png', TRANSPARENT: opts.transparent ?? true, TILED:true },
    projection: proj, serverType: opts.serverType, crossOrigin:'anonymous', attributions: opts.attrib }) });
}
function xyzLayer(tiles, opts={}){
  // XYZ-fliser er Web Mercator; OL reprojiserer dem til kartets CRS
  return new TileLayer({ opacity: opts.opacity ?? 1, zIndex: opts.zIndex ?? 0, source: new ol.source.XYZ({ url: tiles[0], crossOrigin:'anonymous', projection:'EPSG:3857', maxZoom: opts.maxZoom ?? 19 }) });
}
function draftStyle(f){
  const g=f.getGeometry().getType();
  return new Style({ fill:new Fill({color:'rgba(31,138,138,.2)'}), stroke:new Stroke({color:'#1f8a8a', width:2, lineDash:[6,4]}),
    image:new CircleStyle({radius:4, fill:new Fill({color:'#fff'}), stroke:new Stroke({color:'#1f8a8a', width:2})}),
    text: g==='LineString' && f.get('_len') ? new Text({text:f.get('_len'), font:'12px IBM Plex Mono, monospace', placement:'line', offsetY:-8, fill:new Fill({color:'#16313b'}), stroke:new Stroke({color:'#fff', width:3})}) : undefined });
}
function commentStyle(f){
  return new Style({ image:new CircleStyle({radius:8, fill:new Fill({color:f.get('resolved')?'#2e8b57':'#3b7fc4'}), stroke:new Stroke({color:'#fff', width:2})}),
    text:new Text({text:'!', font:'bold 11px IBM Plex Sans, sans-serif', fill:new Fill({color:'#fff'})}) });
}
function hexToRgba(hex, a){ const h=(hex||'#1f8a8a').replace('#',''); const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
function layerStyleFn(l){
  const st=l.style||{};
  return f => {
    let color = st.color||'#1f8a8a';
    if(st.colorBy && st.colorBy.prop){ const v=f.get(st.colorBy.prop); if(st.colorBy.map){ color = st.colorBy.map[String(v)] || color; } else if(v) color=v; }
    return new Style({ fill:new Fill({color:hexToRgba(color, st.fillOpacity ?? .25)}), stroke:new Stroke({color, width:st.width ?? 2}),
      image:new CircleStyle({radius:st.radius ?? 6, fill:new Fill({color}), stroke:new Stroke({color:'#fff', width:1.5})}) });
  };
}

function initMap(){
  draftSource = new VectorSource(); draftLayer = new VectorLayer({source:draftSource, style:draftStyle, zIndex:90});
  commentSource = new VectorSource(); commentLayer = new VectorLayer({source:commentSource, style:commentStyle, zIndex:95});
  popupOverlay = new Overlay({ element:$('#popup'), positioning:'bottom-center', offset:[0,-6], stopEvent:true, autoPan:{animation:{duration:200}} });
  map = new OLMap({ target:'map', layers:[draftLayer, commentLayer], overlays:[popupOverlay], controls:[new ol.control.ScaleLine({units:'metric'})],
    view: new View({ projection:VIEW_CRS, center: fromLonLat([14.5,66.5], VIEW_CRS), zoom:6, maxZoom:MAX_ZOOM, constrainResolution:false }) });
  setViewCrs(VIEW_CRS, [17,65], 5, NORWAY_BBOX);
  map.on('pointermove', e => { if(e.dragging) return; const [x,y]=e.coordinate; $('#coords').textContent = fmtCoord(x,y); const hit = !S.mode && map.hasFeatureAtPixel(e.pixel, {layerFilter: l=>l!==draftLayer}); map.getTargetElement().style.cursor = hit?'pointer':''; });
  map.on('singleclick', onMapClick);
  $('#zoomIn').onclick = () => view.animate({zoom:view.getZoom()+1, duration:200}); $('#zoomOut').onclick = () => view.animate({zoom:view.getZoom()-1, duration:200}); $('#zoomFit').onclick = fitToData;
  $('#popup').addEventListener('click', e=>{ if(e.target.classList.contains('close')) closePopup(); });
}
// Bytter prosjeksjon: ny View + nytt topo-grunnlag. Alle faglag tegnes på nytt i ny CRS.
function setViewCrs(crs, centerLonLat, zoom, fitExtent){
  VIEW_CRS = crs;
  const c = CRS[crs];
  if(topoLayer) map.removeLayer(topoLayer);
  topoLayer = c.base==='topo'
    ? wmsLayer(TOPO_WMS, 'topo', {zIndex:0, transparent:false, format:'image/png', attrib:'© Kartverket'})
    : xyzLayer(['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], {zIndex:0, maxZoom:19});
  map.addLayer(topoLayer);
  view = new View({ projection:crs, extent: c.extent, center: fromLonLat(centerLonLat, crs), zoom: zoom ?? 12, maxZoom:MAX_ZOOM });
  map.setView(view);
  if(fitExtent) view.fit(transformExtent(fitExtent,'EPSG:4326',crs,16), {padding:[20,20,20,20]});
  view.on('change:center', saveView); view.on('change:resolution', saveView);
  const baseName = c.base==='topo' ? 'Kartverket topo' : 'OpenStreetMap';
  $('#crsbadge').innerHTML = `<b>${c.label}</b> · ${c.name} · ${baseName}`;
  $('#crsbadge').title = `${c.region}: kartet og koordinatene vises i ${c.name}. Grunnlag: ${c.base==='topo'?'© Kartverket':'© OpenStreetMap-bidragsytere'}`;
}
function fmtCoord(x,y){ return `N ${Math.round(y).toLocaleString('nb-NO')}  E ${Math.round(x).toLocaleString('nb-NO')}`; }
function readFC(fc){ return GeoJSONFmt.readFeatures(fc, {dataProjection:'EPSG:4326', featureProjection:VIEW_CRS}); }
function writeGeom(geom){ return GeoJSONFmt.writeGeometryObject(geom, {dataProjection:'EPSG:4326', featureProjection:VIEW_CRS}); }
function removeLayerFromMap(l){ if(l._ol){ map.removeLayer(l._ol); l._ol=null; } }
async function renderLayer(l){
  removeLayerFromMap(l);
  const z = 10 + (l.sort_order||0);
  if(l.kind==='vector'){
    const fc = l._fc || (l._fc = await store.layerGeojson(l.id));
    const src = new VectorSource({features: readFC(fc)});
    src.getFeatures().forEach(f=>f.set('_layer', l.id, true));
    l._ol = new VectorLayer({source:src, style:layerStyleFn(l), zIndex:z, visible:l.visible!==false});
  } else if(l.kind==='raster'){
    const s=l.source; ensureProjection(s.projection);
    const url = await store.fileUrl(s.png);
    l._ol = new ol.layer.Image({ zIndex:z, opacity:l.style?.opacity ?? .9, visible:l.visible!==false,
      source:new ol.source.ImageStatic({ url, imageExtent:s.extent, projection:s.projection, crossOrigin:'anonymous', interpolate:true }) });
  } else if(l.kind==='cog'){
    // Stor GeoTIFF/COG i Azure: leses bit for bit med range-forespørsler, aldri hele filen.
    const s=l.source; if(s.projection) ensureProjection(s.projection);
    await loadLib('geotiff','GeoTIFF');
    const url = await store.cogUrl(l.id);
    // Ingen standard nodata: mosaikkene har egen transparensmaske, og nodata=0 ville gjort ekte svarte piksler gjennomsiktige.
    // WGS 84 / UTM (326xx) og EUREF89 / UTM (258xx) i samme sone er like i AGIS sin proj4-definisjon.
    // Da tegnes rasteret i kartets system uten omprojisering, piksel for piksel – ingen resampling.
    const sameZone = /^EPSG:326(\d\d)$/.exec(s.projection||''), viewZone = /^EPSG:258(\d\d)$/.exec(VIEW_CRS||'');
    const proj = (sameZone && viewZone && sameZone[1]===viewZone[1]) ? VIEW_CRS : s.projection;
    const src = new ol.source.GeoTIFF({ sources:[{ url, ...(s.nodata!=null?{nodata:s.nodata}:{}) }], convertToRGB:'auto', normalize:true, interpolate:true,
      sourceOptions:{ allowFullFile:false, cacheSize:500 }, ...(proj?{projection:proj}:{}) });
    l._ol = new ol.layer.WebGLTile({ source:src, zIndex:z, opacity:l.style?.opacity ?? 1, visible:l.visible!==false });
  } else if(l.kind==='wms'){
    const s=l.source; l._ol = wmsLayer(s.url, s.layers, {version:s.version, format:s.format, projections:s.projections, opacity:l.style?.opacity ?? .85, zIndex:z}); l._ol.setVisible(l.visible!==false);
  } else {
    l._ol = xyzLayer(l.source.tiles || [l.source.url], {opacity:l.style?.opacity ?? .85, zIndex:z}); l._ol.setVisible(l.visible!==false);
  }
  map.addLayer(l._ol);
}
async function renderAllLayers(){ for(const l of S.layers){ try{ await renderLayer(l); }catch(e){ console.error(e); toast(`Kunne ikke vise «${l.name}»: ${e.message||e}`); } } renderComments(); }
function renderComments(){
  commentSource.clear();
  S.comments.forEach(c=>{ const f=new Feature({geometry:new ol.geom.Point(fromLonLat([c.lng,c.lat], VIEW_CRS)), id:c.id, resolved:!!c.resolved}); commentSource.addFeature(f); });
}
function layerExtent(l){ if((l.kind==='raster'||l.kind==='cog') && l.source?.extent && l.source?.projection){ ensureProjection(l.source.projection); return transformExtent(l.source.extent, l.source.projection, VIEW_CRS, 8); } if(!l._ol || l.kind!=='vector') return null; const e=l._ol.getSource().getExtent(); return (e && isFinite(e[0]))? e : null; }
async function fitToData(){
  if(!S.map) return;
  let ext=null; S.layers.forEach(l=>{ const e=layerExtent(l); if(e){ ext = ext? ol.extent.extend(ext,e) : e.slice(); } });
  if(!ext){ try{ const b=await store.mapBbox(S.map.id); if(b) ext=transformExtent(b,'EPSG:4326',VIEW_CRS);}catch(e){} }
  if(!ext) return;
  if(ol.extent.getWidth(ext)<1 && ol.extent.getHeight(ext)<1) view.animate({center:ol.extent.getCenter(ext), zoom:14, duration:400});
  else view.fit(ext, {padding:[60,60,60,60], duration:400, maxZoom:17});
}

// ---- Klikk, tegning, måling, kommentarer ---------------------------------
function canEdit(){ return !!(S.user && (S.user.staff || S.access.some(a=>a.email===S.user.email&&a.role==='editor'))); }
function setMode(m){
  if(S.mode===m) m=null;
  S.mode=m; draftSource.clear(); closePopup();
  if(drawInteraction){ map.removeInteraction(drawInteraction); drawInteraction=null; }
  document.querySelectorAll('#drawTools button').forEach(b=>b.classList.toggle('active', b.dataset.mode===m));
  $('#toolbar').parentElement.classList.toggle('mode-draw', !!m);
  const h=$('#modehint');
  const txt={point:'Klikk i kartet for å plassere punkt', line:'Klikk for å legge til punkter – dobbeltklikk for å fullføre', polygon:'Klikk for å legge til hjørner – dobbeltklikk for å fullføre', measure:'Klikk for å måle – dobbeltklikk for å avslutte', comment:'Klikk der kommentaren gjelder'}[m];
  if(txt){ h.hidden=false; h.innerHTML=`<span>${txt}</span><button id="cancelDraft">Avbryt</button>`; $('#cancelDraft').onclick=()=>setMode(null); }
  else h.hidden=true;
  if(m==='point'||m==='line'||m==='polygon'||m==='measure'){
    const type = {point:'Point', line:'LineString', polygon:'Polygon', measure:'LineString'}[m];
    drawInteraction = new ol.interaction.Draw({source:draftSource, type, style:draftStyle});
    if(m==='measure'){
      drawInteraction.on('drawstart', e=>{ e.feature.getGeometry().on('change', ev=>{ const len=ol.sphere.getLength(ev.target, {projection:VIEW_CRS}); e.feature.set('_len', fmtDist(len)); h.querySelector('span').textContent=`Avstand: ${fmtDist(len)} – dobbeltklikk for å avslutte`; }); });
      drawInteraction.on('drawend', ()=>{ setTimeout(()=>{ map.removeInteraction(drawInteraction); drawInteraction=null; h.querySelector('span').textContent += ' (klikk Avbryt for å fjerne)'; },0); });
    } else {
      drawInteraction.on('drawend', e=>{ const g=writeGeom(e.feature.getGeometry()); setTimeout(()=>saveDrawn(g),0); });
    }
    map.addInteraction(drawInteraction);
  }
}
async function onMapClick(e){
  if(drawInteraction) return;
  const ll = toLonLat(e.coordinate, VIEW_CRS).map(v=>+v.toFixed(6));
  if(S.mode==='comment'){ openCommentForm(ll, e.coordinate); return; }
  let hit=null; map.forEachFeatureAtPixel(e.pixel, (f,layer)=>{ if(layer===draftLayer) return; hit={f,layer}; return true; }, {hitTolerance:4});
  if(!hit){ closePopup(); return; }
  if(hit.layer===commentLayer){ showComment(hit.f.get('id')); return; }
  showFeature(hit.f, e.coordinate);
}
async function saveDrawn(geometry){
  if(!canEdit()){ toast('Du har ikke redigeringstilgang'); setMode(null); return; }
  let target = S.layers.find(l=>l.id===S.activeLayerId && l.kind==='vector') || S.layers.find(l=>l.kind==='vector' && l.name==='Tegninger');
  if(!target){ target = await store.createLayer(S.map.id,{name:'Tegninger', kind:'vector', style:{color:'#c84b3a', fillOpacity:.2, width:2, radius:6}, sort_order:S.layers.length}); S.layers.push(target); S.activeLayerId=target.id; }
  const navn = await dialog({title:'Lagre objekt', fields:[{k:'navn',label:'Navn',value:''},{k:'notat',label:'Notat',value:'',type:'textarea'}], ok:'Lagre'});
  setMode(null);
  if(!navn) return;
  await store.importGeojson(target.id,{type:'Feature',geometry,properties:{navn:navn.navn, notat:navn.notat, opprettet:new Date().toISOString().slice(0,10), av:S.user?.email}});
  target._fc = await store.layerGeojson(target.id); await renderLayer(target); renderPanel();
  toast('Lagret i «'+target.name+'»');
}
function closePopup(){ popupOverlay.setPosition(undefined); $('#popup').hidden=true; }
function popupAt(coord, html){ const el=$('#popup'); el.innerHTML=`<button class="close" aria-label="Lukk">×</button>${html}`; el.hidden=false; popupOverlay.setPosition(coord); return el; }
function showFeature(f, coord){
  const p={...f.getProperties()}; delete p.geometry; delete p._layer; const fid=p._id; delete p._id; delete p._color;
  const rows=Object.entries(p).filter(([k,v])=>v!==''&&v!==null&&v!==undefined).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');
  const layer=S.layers.find(l=>l.id===f.get('_layer'));
  const title = p.navn||p.name||p.stasjon||p.klasse||layer?.name||'Objekt';
  const g=f.getGeometry(); const gt=g.getType(); let geomInfo='';
  if(gt==='Point'){ const [x,y]=g.getCoordinates(); geomInfo=`<tr><td>posisjon</td><td class="mono">${fmtCoord(x,y)}</td></tr>`; }
  else if(gt==='LineString'||gt==='MultiLineString') geomInfo=`<tr><td>lengde</td><td>${fmtDist(ol.sphere.getLength(g,{projection:VIEW_CRS}))}</td></tr>`;
  else if(gt==='Polygon'||gt==='MultiPolygon') geomInfo=`<tr><td>areal</td><td>${fmtArea(ol.sphere.getArea(g,{projection:VIEW_CRS}))}</td></tr>`;
  const el=popupAt(coord, `<h4>${esc(title)}</h4><div class="hint" style="margin-bottom:6px">${esc(layer?.name||'')}</div><table>${rows}${geomInfo}</table>${canEdit()?`<div class="row" style="margin-top:8px"><button class="btn small" id="pfEdit">Rediger</button><button class="btn small danger" id="pfDel">Slett</button></div>`:''}`);
  if(canEdit()&&layer){
    el.querySelector('#pfEdit').onclick=async()=>{ const fields=Object.entries(p).map(([k,v])=>({k,label:k,value:v})); if(!fields.some(x=>x.k==='navn')) fields.unshift({k:'navn',label:'navn',value:''}); const res=await dialog({title:'Rediger attributter',fields,ok:'Lagre'}); if(!res) return; await store.updateFeature(fid,null,res); layer._fc=await store.layerGeojson(layer.id); await renderLayer(layer); closePopup(); toast('Oppdatert'); };
    el.querySelector('#pfDel').onclick=async()=>{ const ok=await dialog({title:'Slette objektet?',fields:[],ok:'Slett'}); if(!ok) return; await store.deleteFeature(fid); layer._fc=await store.layerGeojson(layer.id); await renderLayer(layer); closePopup(); toast('Slettet'); };
  }
}
function openCommentForm(ll, coord){
  if(!S.user){ toast('Logg inn for å kommentere'); setMode(null); return; }
  const el=popupAt(coord, `<h4>Ny kommentar</h4><textarea id="cBody" placeholder="Skriv kommentar…"></textarea><div class="row" style="margin-top:8px"><button class="btn primary small" id="cSave">Legg til</button><button class="btn small" id="cCancel">Avbryt</button></div>`);
  el.querySelector('#cBody').focus();
  el.querySelector('#cCancel').onclick=()=>{closePopup(); setMode(null);};
  el.querySelector('#cSave').onclick=async()=>{ const body=el.querySelector('#cBody').value.trim(); if(!body) return; await store.addComment(S.map.id,ll[0],ll[1],body); S.comments=await store.listComments(S.map.id); renderComments(); closePopup(); setMode(null); if(S.tab==='comments') renderPanel(); toast('Kommentar lagt til'); };
}
function showComment(id){
  const c=S.comments.find(x=>x.id===id); if(!c) return;
  const coord=fromLonLat([c.lng,c.lat], VIEW_CRS);
  const mine = S.user && c.author===S.user.email;
  const el=popupAt(coord, `<h4>Kommentar</h4><div style="white-space:pre-wrap">${esc(c.body)}</div><div class="hint mono" style="margin-top:6px">${esc(c.author||'')} · ${fmtDate(c.created_at)}${c.resolved?' · løst':''}</div>${(S.user&&(mine||canEdit()))?`<div class="row" style="margin-top:8px"><button class="btn small" id="cRes">${c.resolved?'Gjenåpne':'Marker som løst'}</button><button class="btn small danger" id="cDel">Slett</button></div>`:''}`);
  const r=el.querySelector('#cRes'); if(r){ r.onclick=async()=>{ await store.setCommentResolved(c.id,!c.resolved); S.comments=await store.listComments(S.map.id); renderComments(); closePopup(); if(S.tab==='comments') renderPanel(); };
    el.querySelector('#cDel').onclick=async()=>{ await store.deleteComment(c.id); S.comments=await store.listComments(S.map.id); renderComments(); closePopup(); if(S.tab==='comments') renderPanel(); }; }
}

async function layerSettings(l){
  const st=l.style||{};
  const fields=[{k:'name',label:'Navn',value:l.name}];
  if(l.kind==='vector'){ fields.push({k:'color',label:'Farge',type:'color',value:st.color||'#1f8a8a'},{k:'fillOpacity',label:'Fyll-gjennomsiktighet (0–1)',value:st.fillOpacity??.25},{k:'width',label:'Linjebredde',value:st.width??2},{k:'radius',label:'Punktstørrelse',value:st.radius??6},{k:'colorProp',label:'Fargelegg etter attributt (valgfritt, f.eks. tilstand)',value:st.colorBy?.prop||''}); }
  else fields.push({k:'opacity',label:'Gjennomsiktighet (0–1)',value:st.opacity??.85});
  const r=await dialog({title:'Laginnstillinger',fields,ok:'Lagre',extra:'<button class="btn small danger" id="dlgDelete">Slett lag</button>'});
  if(r==='__delete'){ if(l.kind==='raster') store.removeFiles([l.source?.png, l.source?.tif]).catch(()=>{}); await store.deleteLayer(l.id); removeLayerFromMap(l); S.layers=S.layers.filter(x=>x.id!==l.id); renderPanel(); toast('Lag slettet'); return; }
  if(!r) return;
  const style = l.kind==='vector' ? {...st, color:r.color, fillOpacity:+r.fillOpacity, width:+r.width, radius:+r.radius, colorBy: r.colorProp ? (r.colorProp==='tilstand'?{prop:'tilstand',map:TILSTAND,legend:{1:'Tilstand 1',2:'Tilstand 2',3:'Tilstand 3',4:'Tilstand 4'}}:{prop:r.colorProp}) : undefined} : {...st, opacity:+r.opacity};
  if(style.colorBy===undefined) delete style.colorBy;
  Object.assign(l, await store.updateLayer(l.id,{name:r.name, style}), {_fc:l._fc});
  await renderLayer(l); renderPanel();
}

const LIBS = {
  jszip:  'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
  shp:    'https://cdn.jsdelivr.net/npm/shpjs@4.0.4/dist/shp.min.js',

  sqljs:  'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js',
  sqljsWasm: 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.wasm',

const _libs = {};
function loadLib(name, globalName){
  if(window[globalName]) return Promise.resolve(window[globalName]);
  if(!_libs[name]) _libs[name] = new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=LIBS[name]; s.onload=()=>res(window[globalName]); s.onerror=()=>rej(new Error('Klarte ikke å laste '+name)); document.head.appendChild(s); });
  return _libs[name];
}
const FORMAT_LABEL = { geojson:'GeoJSON', kml:'KML', kmz:'KMZ (Google Earth)', gpx:'GPX', shapezip:'Shapefile (zip)', shapeparts:'Shapefile', csv:'CSV/tekst med koordinater', xlsx:'Excel med koordinater', raster:'GeoTIFF (raster)', gpkg:'GeoPackage' };

    return NOR_CRS.includes(VIEW_CRS) ? VIEW_CRS : 'EPSG:25833';

// Spør om koordinatsystem når filen ikke oppgir det og verdiene ikke er grader
async function resolveCrs(fc, fileName, known){
  if(known && known!=='EPSG:4326' && !ensureProjection(known)){
    const r = await dialog({title:'Ukjent koordinatsystem', text:`«${fileName}» oppgir ${known}, som AGIS ikke kjenner. Velg riktig system:`, fields:[{k:'crs',label:'Koordinatsystem',type:'select',value:'EPSG:25833',options:crsChoices()}], ok:'Importer'});
    return r ? r.crs : null;
  }
  if(known) return known;
  const {xs, ys} = sampleCoords(fc);
  if(!xs.length) return 'EPSG:4326';
  if(looksGeographic(xs, ys)) return 'EPSG:4326';
  const guess = guessProjected(xs, ys);
  const r = await dialog({title:'Hvilket koordinatsystem?', text:`«${fileName}» har projiserte koordinater (f.eks. Ø ${Math.round(median(xs)).toLocaleString('nb-NO')}, N ${Math.round(median(ys)).toLocaleString('nb-NO')}) uten oppgitt koordinatsystem. Forslaget er basert på verdiene – bekreft eller velg riktig:`,
    fields:[{k:'crs',label:'Koordinatsystem',type:'select',value:guess,options:crsChoices()}], ok:'Importer'});
  return r ? r.crs : null;
}

// --- Gjenkjenning -----------------------------------------------------------
async function sniff(file){
  const e = ext(file.name);
  const map = {geojson:'geojson', json:'geojson', kml:'kml', kmz:'kmz', gpx:'gpx', csv:'csv', txt:'csv', tsv:'csv', xyz:'csv', xlsx:'xlsx', xls:'xlsx', tif:'raster', tiff:'raster', gpkg:'gpkg', shp:'shapeparts', dbf:'shapeparts', prj:'shapeparts', cpg:'shapeparts', shx:'shapeparts'};
  if(e==='zip'){
    const JSZip = await loadLib('jszip','JSZip'); const z = await JSZip.loadAsync(await file.arrayBuffer());
    const names = Object.keys(z.files).map(n=>n.toLowerCase());
    if(names.some(n=>n.endsWith('.shp'))) return 'shapezip';
    if(names.some(n=>n.endsWith('.kml'))) return 'kmz';
    if(names.some(n=>/\.(geo)?json$/.test(n))) return 'zipgeojson';
    return null;
  }
  if(map[e]) return map[e];
  const head = new Uint8Array(await file.slice(0, 512).arrayBuffer());
  const txt = new TextDecoder().decode(head).trim();
  if(head[0]===0x49&&head[1]===0x49&&head[2]===0x2a || head[0]===0x4d&&head[1]===0x4d&&head[3]===0x2a) return 'raster';
  if(head[0]===0x50&&head[1]===0x4b) return 'kmz';
  if(txt.startsWith('{')) return 'geojson';
  if(/<kml/i.test(txt)) return 'kml';
  if(/<gpx/i.test(txt)) return 'gpx';
  if(/^[^\n]*[;,\t][^\n]*\n/.test(txt)) return 'csv';
  return null;
}

// CSV / Excel: finn koordinatkolonner, spør hvis uklart
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = [';','\t',','].map(d=>[d, first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===delim){ row.push(cur); cur=''; }
    else if(ch==='\n' || ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=ch; }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
// Tolker desimalgrader, grader+minutter og grader+minutter+sekunder, med N/S/Ø/E/V/W og komma som desimaltegn
function parseCoordValue(raw){
  if(raw===null||raw===undefined) return NaN; if(typeof raw==='number') return raw;
  let s = String(raw).trim().replace(/[’′]/g,"'").replace(/[”″]/g,'"'); if(!s) return NaN;
  const isDms = /[°'"]|^[NSØEVW]\s*\d|\d\s*[NSØEVW]$/i.test(s);
  if(!isDms){ s = s.replace(/\s/g,''); if(/^-?\d+,\d+$/.test(s)) s=s.replace(',','.'); else if(/^-?[\d.]+,\d+$/.test(s)) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); const v=parseFloat(s); return Number.isFinite(v)?v:NaN; }
  let sign = 1; const hem = (s.match(/^[NSØEVW]|[NSØEVW]$/i)||[''])[0].toUpperCase(); if(hem==='S'||hem==='W'||hem==='V') sign=-1;
  if(/^-/.test(s.replace(/^[NSØEVW]\s*/i,''))) sign=-1;
  const nums = (s.match(/\d+(?:[.,]\d+)?/g)||[]).map(x=>parseFloat(x.replace(',','.')));
  if(!nums.length) return NaN;
  return sign * (nums[0] + (nums[1]||0)/60 + (nums[2]||0)/3600);
}
const norm = h => String(h||'').toLowerCase().replace(/[\s_\-().°]/g,'');
function detectColumns(header){
  const n = header.map(norm);
  const find = (...res) => n.findIndex(h=>res.some(r=>r.test(h)));
  return {
    lat: find(/^lat/, /latitude/, /breddegrad/, /^bredde/, /^nbredde/),
    lon: find(/^lon/, /^lng/, /longitude/, /lengdegrad/, /^lengde/),
    north: find(/^(n|nord|north|northing|y|ykoord|ykoordinat|utmn|nordkoordinat|nordm)$/, /northing/),
    east: find(/^(e|ø|ost|øst|east|easting|x|xkoord|xkoordinat|utme|østkoordinat|ostkoordinat|østm|ostm)$/, /easting/),
    zone: find(/^(sone|zone|utmsone|utmzone)$/),
  };
}
async function rowsToFC(rows, name){
  if(rows.length<2) throw new Error(`«${name}» har ingen datarader`);
  const header = rows[0].map(h=>String(h).trim()); const data = rows.slice(1);
  const col = detectColumns(header);
  let xi, yi, geographic, confident = true;
  if(col.lat>=0 && col.lon>=0){ xi=col.lon; yi=col.lat; }
  else if(col.east>=0 && col.north>=0){ xi=col.east; yi=col.north; }
  else confident = false;
  const vals = i => data.slice(0,200).map(r=>parseCoordValue(r[i]));
  if(confident){ const xs=vals(xi), ys=vals(yi); if(xs.filter(Number.isFinite).length < Math.min(3, data.length)) confident=false; }
  if(!confident){
    const opts = header.map((h,i)=>[String(i), h||`Kolonne ${i+1}`]);
    const r = await dialog({title:'Hvilke kolonner er koordinater?', text:`Fant ikke koordinatkolonnene i «${name}» med sikkerhet. Velg øst/lengdegrad og nord/breddegrad:`,
      fields:[{k:'x',label:'Øst / lengdegrad (X)',type:'select',value:String(col.lon>=0?col.lon:col.east>=0?col.east:1),options:opts},{k:'y',label:'Nord / breddegrad (Y)',type:'select',value:String(col.lat>=0?col.lat:col.north>=0?col.north:0),options:opts}], ok:'Neste'});
    if(!r) return null; xi=+r.x; yi=+r.y;
  }
  const xs=vals(xi), ys=vals(yi);
  geographic = looksGeographic(xs.filter(Number.isFinite), ys.filter(Number.isFinite));
  let crs = 'EPSG:4326';
  const perRowZone = !geographic && col.zone>=0;
  if(!geographic && !perRowZone){
    crs = await resolveCrs({features:[{geometry:{coordinates:[median(xs), median(ys)]}}]}, name, null);
    if(!crs) return null;
  }
  const features=[]; let skipped=0;
  data.forEach(r=>{
    let x=parseCoordValue(r[xi]), y=parseCoordValue(r[yi]);
    if(!Number.isFinite(x)||!Number.isFinite(y)){ skipped++; return; }
    if(perRowZone){ const z=parseInt(r[col.zone],10); const code=ensureProjection(25800+z); if(!code){ skipped++; return; } [x,y]=proj4(code,'EPSG:4326',[x,y]); }
    const props={}; header.forEach((h,i)=>{ if(i===xi||i===yi||!h) return; const v=r[i]; if(v===''||v===undefined||v===null) return; const num = typeof v==='number' ? v : (/^-?\d+([.,]\d+)?$/.test(String(v).trim()) ? parseFloat(String(v).replace(',','.')) : v); props[h]=num; });
    features.push({type:'Feature', geometry:{type:'Point', coordinates:[x,y]}, properties:props});
  });
  if(skipped) toast(`${skipped} rader uten gyldige koordinater ble hoppet over`);
  const fc = {type:'FeatureCollection',features};
  if(!perRowZone) reprojectFC(fc, crs);
  return [{name, fc, crs:'EPSG:4326', resolved:true}];
}
async function readCSV(file){ return rowsToFC(parseCSV(await file.text()), baseName(file.name)); }

// GeoTIFF: leses i nettleseren, nedskaleres og fargelegges til et bilde som legges oppå kartet.
// Originalfilen lagres i Supabase Storage for nedlasting.
const RAMP_DEPTH = [[0,'#e6f4f1'],[0.2,'#a9d8e6'],[0.45,'#5aa6d6'],[0.7,'#2a6fb0'],[1,'#16313b']];
const RAMP_TERRAIN = [[0,'#2a6fb0'],[0.25,'#8fc8a0'],[0.5,'#e4d79a'],[0.75,'#b58b5a'],[1,'#ffffff']];

    const r = await dialog({title:'Koordinatsystem for rasteret', text:`«${file.name}» oppgir ${code&&code!==32767?'EPSG:'+code+', som AGIS ikke kjenner':'ikke koordinatsystem'}. Velg riktig:`, fields:[{k:'crs',label:'Koordinatsystem',type:'select',value:VIEW_CRS,options:crsChoices()}], ok:'Importer'});

  }

      out.data[i*4+3]= st===4 ? px[j+3]/div : ((px[j]===0&&px[j+1]===0&&px[j+2]===0)?0:255); }

  let canvas=sc; const rotated = Math.abs(b)>1e-12 || Math.abs(d)>1e-12;

    canvas=document.createElement('canvas'); canvas.width=DW; canvas.height=DH; const dctx=canvas.getContext('2d');
    dctx.setTransform(a/(s*P), -d/(s*P), b/(s*P), -e/(s*P), (c-bbox[0])/P, (bbox[3]-f)/P);
    dctx.imageSmoothingQuality='high'; dctx.drawImage(sc,0,0);
  }
  const png = await new Promise(r=>canvas.toBlob(r,'image/png'));
  const res = Math.sqrt(Math.abs(a*e-b*d));
  return [{name:baseName(file.name), raster:{png, original:file, extent:bbox, projection:crs, legend, size:[W,H], resolution:res, rotated}}];
}

const JUNK = n => /^\.|^Thumbs\.db$|\.aux\.xml$|\.ovr$|\.xml$|\.qmd$|\.qml$|\.sld$|\.lock$|-journal$|\.gpkg-(wal|shm)$/i.test(n);
// Leser filer fra et drop-event, inkludert mapper og undermapper. Returnerer [{file, path}]
async function collectDropped(dt){
  const items = dt.items ? [...dt.items].filter(i=>i.kind==='file') : [];
  const entries = items.map(i=>i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if(!entries.length) return [...(dt.files||[])].map(f=>({file:f, path:f.webkitRelativePath||f.name}));
  const out=[];
  const readDir = dir => new Promise((res,rej)=>{ const r=dir.createReader(); const all=[]; const next=()=>r.readEntries(b=>{ if(!b.length) res(all); else { all.push(...b); next(); } }, rej); next(); });
  async function walk(entry, prefix){
    if(entry.isFile){ const f = await new Promise((res,rej)=>entry.file(res,rej)); out.push({file:f, path: prefix+f.name}); }
    else if(entry.isDirectory){ for(const ch of await readDir(entry)) await walk(ch, prefix+entry.name+'/'); }
  }
  for(const en of entries) await walk(en, '');
  return out;
}
function filesFromInput(fl){ return [...fl].map(f=>({file:f, path:f.webkitRelativePath||f.name})); }

// GeoPackage (.gpkg) – SQLite med geometri i GPKG-binærformat. Leses med sql.js i nettleseren.
async function readGPKG(file){
  if(!window.initSqlJs) await loadLib('sqljs','initSqlJs');
  const SQL = window._sqljs || (window._sqljs = await initSqlJs({locateFile: f => LIBS.sqljsWasm}));
  const db = new SQL.Database(new Uint8Array(await file.arrayBuffer()));
  try{
    const q = (s,p) => { const st=db.prepare(s); if(p) st.bind(p); const rows=[]; while(st.step()) rows.push(st.getAsObject()); st.free(); return rows; };
    const layers = q("select c.table_name, g.column_name, g.srs_id, s.organization, s.organization_coordsys_id from gpkg_contents c join gpkg_geometry_columns g on g.table_name=c.table_name left join gpkg_spatial_ref_sys s on s.srs_id=g.srs_id where c.data_type='features'");
    if(!layers.length) throw new Error('GeoPackage uten vektorlag (rasterlag i GeoPackage støttes ikke ennå)');
    const wkb = new ol.format.WKB(); const parts=[];
    for(const L of layers){
      const epsg = (String(L.organization||'').toUpperCase()==='EPSG' && L.organization_coordsys_id) ? L.organization_coordsys_id : L.srs_id;
      const crs = (epsg===4326||epsg===4258) ? 'EPSG:4326' : (ensureProjection(epsg) || null);
      const rows = q(`select * from "${String(L.table_name).replace(/"/g,'""')}"`);
      const features=[];
      for(const r of rows){
        const blob = r[L.column_name]; if(!blob || !blob.length) continue;
        // GPKG-header: 'GP', versjon, flagg, srs_id, envelope (lengde fra flagg), deretter WKB
        const flags = blob[3]; const envInd = (flags>>1)&7; const envLen = [0,32,48,48,64][envInd]||0; const off = 8+envLen;
        let geom; try{ geom = wkb.readGeometry(blob.subarray(off)); }catch(_){ continue; }
        const g = GeoJSONFmt.writeGeometryObject(geom); if(g.coordinates) g.coordinates = strip3(g.coordinates);
        const props={}; for(const [k,v] of Object.entries(r)){ if(k===L.column_name || v instanceof Uint8Array || v===null) continue; props[k]=v; }
        features.push({type:'Feature', geometry:g, properties:props});
      }
      parts.push({name: layers.length>1 ? `${baseName(file.name)} – ${L.table_name}` : baseName(file.name), fc:{type:'FeatureCollection',features}, crs});
    }
    return parts;
  } finally { db.close(); }
}

// --- Hovedflyt ---------------------------------------------------------------
// entries: [{file, path}] eller FileList. Filer i undermapper får mappenavnet som lagnavn og grupperes etter toppmappen.
async function importFiles(input, opts={}){
  if(!S.map){ toast('Åpne et kart først'); return; }
  if(!canEdit()){ toast('Kun administratorer og redigerere kan legge til lag'); return; }
  let entries = Array.isArray(input) ? input : filesFromInput(input);
  const skipped = entries.filter(e=>JUNK(e.file.name)).length;
  entries = entries.filter(e=>!JUNK(e.file.name));
  if(!entries.length){ toast('Fant ingen filer å importere'); return; }
  // Grupper: shapefil-deler med samme navn i samme mappe hører sammen
  const dirOf = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
  const groups=[]; const shp={};
  for(const en of entries){ const e=ext(en.file.name); if(['shp','dbf','prj','cpg','shx','sbn','sbx'].includes(e)){ (shp[dirOf(en.path)+'|'+baseName(en.file.name).toLowerCase()] ||= []).push(en); } else groups.push([en]); }
  Object.values(shp).forEach(g=>groups.push(g));
  // Lagnavn: undermappens navn når filen ligger i en mappe, ellers filnavnet. Gruppe = toppmappen.
  const perDir = {}; groups.forEach(g=>{ const d=dirOf(g[0].path); perDir[d]=(perDir[d]||0)+1; });
  const nameFor = (g, fallback) => { const d=dirOf(g[0].path); const leaf=d.split('/').pop(); if(!leaf) return fallback; return perDir[d]>1 ? `${leaf} · ${fallback===leaf?'':fallback}`.replace(/ · $/,'') : leaf; };
  const groupFor = g => { const d=dirOf(g[0].path); return d ? d.split('/')[0] : (opts.group||null); };
  let added=0, failed=[]; const total=groups.length;
  for(let gi=0; gi<groups.length; gi++){
    const g=groups[gi]; const files=g.map(x=>x.file);
    const label = files.length>1 ? baseName(files[0].name) : files[0].name;
    const prog = total>1 ? ` (${gi+1}/${total})` : '';
    try{
      showBusy(`Leser ${label}${prog} …`);
      let kind = files.length>1 ? 'shapeparts' : (ext(files[0].name)==='gpkg' ? 'gpkg' : await sniff(files[0]));
      if(!kind){
        hideBusy();
        const r = await dialog({title:'Hva slags fil er dette?', text:`Klarte ikke å gjenkjenne «${g[0].path}». Velg format, eller hopp over:`, fields:[{k:'kind',label:'Format',type:'select',value:'skip',options:[['skip','Hopp over filen'],...Object.entries(FORMAT_LABEL).filter(([k])=>k!=='shapeparts')]}], ok:'Fortsett'});
        if(!r || r.kind==='skip') continue; kind=r.kind; showBusy(`Leser ${label}${prog} …`);
      }
      let parts;
      if(kind==='geojson') parts = await readGeoJSON(files[0]);
      else if(kind==='gpkg') parts = await readGPKG(files[0]);
      else if(kind==='kml') parts = await readKML(await files[0].text(), baseName(files[0].name));
      else if(kind==='kmz') parts = await readKMZ(files[0]);
      else if(kind==='gpx') parts = await readGPX(files[0]);
      else if(kind==='shapezip') parts = await readShapeZip(files[0]);
      else if(kind==='shapeparts') parts = await readShapeParts(files);
      else if(kind==='zipgeojson'){ const JSZip=await loadLib('jszip','JSZip'); const z=await JSZip.loadAsync(await files[0].arrayBuffer()); const n=Object.keys(z.files).find(x=>/\.(geo)?json$/i.test(x)); parts = await readGeoJSON(new File([await z.file(n).async('blob')], n)); }
      else if(kind==='csv'){ hideBusy(); parts = await readCSV(files[0]); }
      else if(kind==='xlsx'){ hideBusy(); parts = await readXLSX(files[0]); }
      else if(kind==='raster') parts = await readGeoTIFF(files[0]);
      hideBusy();
      if(!parts) continue;
      const group = groupFor(g);
      for(const part of parts){
        const typeLabel = part.raster ? 'mosaikk' : 'vektor';
        part.name = g[0].path.includes('/') ? nameFor(g, typeLabel) : part.name;
        if(part.raster){ await addRasterLayer(part, group); added++; continue; }
        if(!part.resolved){ const crs = await resolveCrs(part.fc, part.name, part.crs); if(!crs) continue; part.fc = reprojectFC(part.fc, crs); }
        const n = await addVectorLayer(part.name, part.fc, group);
        if(n) added++;
      }
    }catch(e){ hideBusy(); console.error(e); failed.push(`${g[0].path}: ${e.message||e}`); }
  }
  hideBusy();
  if(added){ renderPanel(); fitToData(); }
  if(failed.length) await dialog({title:`${failed.length} fil${failed.length>1?'er':''} kunne ikke importeres`, text: failed.slice(0,12).join('\n') + (failed.length>12?`\n… og ${failed.length-12} til`:''), fields:[], ok:'OK'});
  if(total>1) toast(`${added} lag lagt til${skipped?`, ${skipped} hjelpefiler hoppet over`:''}`);
  return added;
}

async function addVectorLayer(name, fc, group){
  fc.features = (fc.features||[]).filter(f=>f && f.geometry);
  if(!fc.features.length){ toast(`«${name}» inneholder ingen geometrier`); return 0; }
  const {xs, ys} = sampleCoords(fc);
  if(!looksGeographic(xs, ys)) throw new Error('Koordinatene ble ikke gyldige grader etter omregning – sjekk valgt koordinatsystem');
  const keys = new Set(); fc.features.slice(0,50).forEach(f=>Object.keys(f.properties||{}).forEach(k=>keys.add(k.toLowerCase())));
  const style = {color:randomColor(), fillOpacity:.25, width:2, radius:6}; if(group) style.group=group;
  if(keys.has('tilstand')) style.colorBy = {prop:'tilstand', map:TILSTAND, legend:{1:'Tilstand 1',2:'Tilstand 2',3:'Tilstand 3',4:'Tilstand 4'}};
  const l = await store.createLayer(S.map.id,{name, kind:'vector', style, sort_order:S.layers.length});
  let n=0; for(let i=0;i<fc.features.length;i+=500){ showBusy(`Lagrer ${name} (${Math.min(i+500,fc.features.length)}/${fc.features.length}) …`); n += await store.importGeojson(l.id, {type:'FeatureCollection', features:fc.features.slice(i,i+500)}); }
  hideBusy();
  l._fc = await store.layerGeojson(l.id); S.layers.push(l); S.activeLayerId=l.id; await renderLayer(l);
  toast(`«${name}»: ${n} objekter importert`);
  return n;
}
async function addRasterLayer(part, group){
  const r = part.raster; showBusy(`Laster opp ${part.name} …`);
  const id = uuid();
  const pngPath = await store.uploadFile(`${S.map.id}/${id}.png`, r.png, 'image/png');
  const tifPath = await store.uploadFile(`${S.map.id}/${id}-${r.original.name.replace(/[^\w.\-]/g,'_')}`, r.original, 'image/tiff');
  const l = await store.createLayer(S.map.id,{name:part.name, kind:'raster', source:{png:pngPath, tif:tifPath, extent:r.extent, projection:r.projection, legend:r.legend, size:r.size, resolution:r.resolution}, style:{opacity:.9, ...(group?{group}:{})}, sort_order:S.layers.length});
  hideBusy(); S.layers.push(l); await renderLayer(l);
  toast(`«${part.name}» lagt til (${r.size[0]}×${r.size[1]} px, ${r.resolution<0.1?(r.resolution*1000).toFixed(1)+' mm':r.resolution.toFixed(2)+' m'} oppløsning, ${r.projection})`);
}
function showBusy(msg){ let b=$('#busy'); if(!b){ b=document.createElement('div'); b.id='busy'; b.className='toast busy'; document.body.appendChild(b); } b.textContent=msg; b.hidden=false; }
function hideBusy(){ const b=$('#busy'); if(b) b.hidden=true; }

function canDropHere(){ return S.map ? canEdit() : !!(S.user && S.user.staff); }
// Slipp filer/mapper i kartlisten → nytt kart for (ny eller eksisterende) kunde
async function newMapFromFiles(list){
  if(!(S.user && S.user.staff)){ toast('Kun ansatte kan opprette kart'); return; }
  list = list.filter(e=>!JUNK(e.file.name)); if(!list.length){ toast('Fant ingen filer å importere'); return; }
  const top = list[0].path.includes('/') ? list[0].path.split('/')[0] : baseName(list[0].file.name);
  const nDirs = new Set(list.map(e=>e.path.includes('/')?e.path.slice(0,e.path.lastIndexOf('/')):'')).size;
  let customers=[]; try{ customers=[...new Set((await store.listMaps()).map(m=>m.customer).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'nb')); }catch(_){}
  const r = await dialog({title:'Nytt kart fra filer', text:`${list.length} filer${nDirs>1?` i ${nDirs} mapper`:''}. Velg en eksisterende kunde, eller skriv navnet på en ny.`, fields:[
    {k:'customer',label:'Kunde',type:'datalist',value:'',options:customers},
    {k:'title',label:'Kartnavn',value:top},
    {k:'restricted',label:'Tilgang',type:'checkbox',value:true,hint:'Begrenset kart – bare personer du legger til ser det, heller ikke andre ansatte. Brukes for gradert eller sensitiv data. Visninger logges.'}], ok:'Opprett og importer'});
  if(!r || !r.title) return;
  const m = await store.createMap({customer:r.customer||null, title:r.title, restricted:!!r.restricted, crs:VIEW_CRS});
  await openMap(m.id);
  await importFiles(list);
  let ext=null; S.layers.forEach(l=>{ const e=layerExtent(l); if(e) ext = ext ? ol.extent.extend(ext,e) : e.slice(); });
  if(ext){ const [lng,lat]=toLonLat(ol.extent.getCenter(ext),VIEW_CRS); const crs=crsFor(lng,lat);
    await store.updateMap(m.id,{crs, center_lng:lng, center_lat:lat}).catch(()=>{}); if(crs!==VIEW_CRS) await setMapCrs(crs); await fitToData(); }
}
// Dra og slipp hvor som helst over kartet (kun for redigerere)
function initDropZone(){
  const wrap = $('.mapwrap'); const ov = $('#dropOverlay'); let depth=0;
  const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types||[])].includes('Files');
  document.addEventListener('dragenter', e=>{ if(!hasFiles(e)||!canDropHere()) return; depth++; ov.hidden=false; $('#dropOverlay b').textContent = S.map ? 'Slipp filer eller mapper for å legge dem til som lag' : 'Slipp filer eller mapper for å lage et nytt kart'; });
  document.addEventListener('dragleave', e=>{ if(!hasFiles(e)) return; depth=Math.max(0,depth-1); if(!depth) ov.hidden=true; });
  document.addEventListener('dragover', e=>{ if(hasFiles(e)) e.preventDefault(); });
  document.addEventListener('drop', e=>{ if(!hasFiles(e)) return; e.preventDefault(); depth=0; ov.hidden=true; if($('#dialogHost').children.length) return; const dt=e.dataTransfer; collectDropped(dt).then(list=> S.map ? importFiles(list) : newMapFromFiles(list)).catch(err); });
}

// ---- Dialog / toast / hjelpere -------------------------------------------
function dialog({title, fields, ok, text, extra}){
  return new Promise(res=>{
    const host=$('#dialogHost');
    host.innerHTML=`<div class="dialog" role="dialog" aria-modal="true"><form class="box"><h3>${esc(title)}</h3>${text?`<p class="hint">${esc(text)}</p>`:''}${fields.map(f=>`<div class="field"><label for="f_${f.k}">${esc(f.label)}</label>${f.type==='textarea'?`<textarea id="f_${f.k}" name="${f.k}" rows="3">${esc(f.value)}</textarea>`:f.type==='select'?`<select id="f_${f.k}" name="${f.k}">${f.options.map(o=>`<option value="${esc(o[0])}" ${o[0]==f.value?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:f.type==='checkbox'?`<label class="chk"><input id="f_${f.k}" name="${f.k}" type="checkbox" ${f.value?'checked':''}> ${esc(f.hint||'')}</label>`:`<input id="f_${f.k}" name="${f.k}" type="${f.type==='datalist'?'text':(f.type||'text')}" value="${esc(f.value)}" ${f.type==='datalist'?`list="dl_${f.k}" autocomplete="off"`:''}>${f.type==='datalist'?`<datalist id="dl_${f.k}">${(f.options||[]).map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`:''}`}</div>`).join('')}<div class="row" style="justify-content:space-between;margin-top:6px"><div>${extra||''}</div><div class="row"><button type="button" class="btn" id="dlgCancel">Avbryt</button><button type="submit" class="btn primary">${esc(ok)}</button></div></div></form></div>`;
    const form=host.querySelector('form'); const first=form.querySelector('input,textarea,select'); if(first) first.focus();
    const close=v=>{ host.innerHTML=''; res(v); };
    host.querySelector('#dlgCancel').onclick=()=>close(null);
    const del=host.querySelector('#dlgDelete'); if(del) del.onclick=()=>close('__delete');
    form.onsubmit=e=>{ e.preventDefault(); const o={}; fields.forEach(f=>o[f.k]= f.type==='checkbox' ? form.elements[f.k].checked : form.elements[f.k].value); close(fields.length?o:true); };
    host.querySelector('.dialog').onclick=e=>{ if(e.target.classList.contains('dialog')) close(null); };
  });
}
let toastT; function toast(msg){ let t=$('.toast'); if(!t){ t=document.createElement('div'); t.className='toast'; document.body.appendChild(t);} t.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2600); }
function err(e){ console.error(e); toast('Feil: '+(e.message||e)); }
function copy(s){ (navigator.clipboard?.writeText(s)||Promise.reject()).then(()=>toast('Kopiert'),()=>{ const i=$('#shareLink'); if(i){ i.select(); } toast('Marker og kopier manuelt'); }); }
function download(name, text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/geo+json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
function randomColor(){ const c=['#1f8a8a','#224754','#c84b3a','#d99a1f','#3b7fc4','#7b4fa3','#2e8b57']; return c[Math.floor(Math.random()*c.length)]; }

// ---- Åpne kart / oppstart ---------------------------------------------------
async function openMap(id){
  let m; try{ m=await store.getMap(id);}catch(e){ err(e); }
  if(!m){ toast('Fant ikke kartet, eller du mangler tilgang'); history.replaceState(null,'','?'); return renderMapsList(); }
  S.layers.forEach(removeLayerFromMap); closePopup(); setMode(null);
  S.map=m; S.layers=[]; S.comments=[]; S.activeLayerId=null; S.tab='layers';
  if(m.restricted) store.logAccess(m.id,'open').catch(()=>{});
  $('#lockBadge').hidden = !m.restricted;
  if(!EMBED) history.replaceState(null,'',`?map=${id}`);
  $('#mapTitle').value=m.title; $('#mapTitle').readOnly=true;
  try{ [S.layers,S.comments,S.access] = await Promise.all([store.listLayers(id), store.listComments(id), store.listAccess(id).catch(()=>[])]); }catch(e){ err(e); }
  for(const l of S.layers){ if(l.kind==='vector'){ try{ l._fc=await store.layerGeojson(l.id);}catch(e){ l._fc={type:'FeatureCollection',features:[]}; } } }
  const can=canEdit();
  $('#mapTitle').readOnly=!can; if(can){ $('#mapTitle').onchange=()=>{ S.map.title=$('#mapTitle').value; store.updateMap(S.map.id,{title:S.map.title}).catch(err); }; }
  $('#drawTools').hidden = !(can || S.user);  // kunder kan måle/kommentere
  document.querySelectorAll('#drawTools [data-mode=point],#drawTools [data-mode=line],#drawTools [data-mode=polygon]').forEach(b=>b.hidden=!can);
  // CRS: lagret på kartet, ellers bestemt av senter (eller av dataene om senter mangler)
  let centerLL = (m.center_lng && m.center_lat) ? [m.center_lng, m.center_lat] : null;
  if(!centerLL){ let b=null; S.layers.filter(l=>l._fc).forEach(l=>{ b=bboxOf(l._fc,b); }); centerLL = b ? [(b[0]+b[2])/2,(b[1]+b[3])/2] : [14.5,66.5]; }
  const crs = m.crs && CRS[m.crs] ? m.crs : crsFor(centerLL[0], centerLL[1]);
  S.suppressSave=true;
  setViewCrs(crs, centerLL, m.zoom||12);
  await renderAllLayers();
  if(!(m.center_lng && m.center_lat)) await fitToData();
  setTimeout(()=>{ S.suppressSave=false; }, 800);
  if(EMBED){ const b=$('#embedbadge'); b.hidden=false; b.innerHTML=`<img src="logo-white.png" alt="Aspecto" style="height:18px;width:auto"><span>${esc(m.title)}</span><a href="${location.origin+location.pathname}?map=${id}" target="_top" rel="noopener">Åpne i AGIS →</a>`; }
  setTab('layers');
  if(window.innerWidth<=760) $('#panel').classList.remove('open');
}
let viewT; function saveView(){ if(S.suppressSave) return; clearTimeout(viewT); viewT=setTimeout(()=>{ if(!S.map||!canEdit()||!view) return; const [lng,lat]=toLonLat(view.getCenter(), VIEW_CRS); store.updateMap(S.map.id,{center_lng:lng,center_lat:lat,zoom:view.getZoom()}).catch(()=>{}); }, 1500); }
async function setMapCrs(crs){
  if(!S.map || !CRS[crs] || crs===VIEW_CRS) return;
  const c=toLonLat(view.getCenter(), VIEW_CRS); const z=view.getZoom();
  S.suppressSave=true; setViewCrs(crs, c, z); await renderAllLayers(); setTimeout(()=>{S.suppressSave=false;},800);
  S.map.crs=crs; if(canEdit()) store.updateMap(S.map.id,{crs}).catch(()=>{});
  renderPanel(); toast('Kartet vises nå i '+CRS[crs].name);
}

document.querySelectorAll('#drawTools button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$('#brandLink').onclick=e=>{ e.preventDefault(); $('#lockBadge').hidden=true; S.layers.forEach(removeLayerFromMap); S.layers=[]; S.comments=[]; renderComments(); closePopup(); setMode(null); S.map=null; history.replaceState(null,'','?'); $('#drawTools').hidden=true; renderMapsList(); if(window.innerWidth<=760) $('#panel').classList.add('open'); };

async function boot(){
  if(EMBED) $('#app').classList.add('embed');
  S.user = await store.getUser().catch(()=>null);
  renderUser();
  const id=qs.get('map');
  if(id) await openMap(id); else { $('#drawTools').hidden=true; await renderMapsList(); if(window.innerWidth<=760 && !EMBED) $('#panel').classList.add('open'); }
}
initMap();
initDropZone();
boot().catch(err);
if(!DEMO){ store.sb.auth.onAuthStateChange((ev, session)=>{ const em=(session?.user?.email||'').toLowerCase(); if((ev==='SIGNED_IN'||ev==='SIGNED_OUT') && em!==(S.user?.email||'')) boot().catch(err); }); }
})();
